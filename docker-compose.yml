version: "3.9"

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama

    ports:
      - "11434:11434"

    environment:
      # Let Ollama handle concurrent requests so PDF chunk
      # embeddings are processed in parallel (much faster uploads).
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "2"
      # Keep models loaded to avoid reload delays between requests.
      OLLAMA_KEEP_ALIVE: "30m"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

  ollama-init:
    build:
      context: .
      dockerfile: docker/ollama-init/Dockerfile

    container_name: ollama-init

    environment:
      OLLAMA_HOST: http://ollama:11434

    depends_on:
      - ollama

    volumes:
      - ollama_data:/root/.ollama

    restart: "no"

  rag-app:
    build: .

    container_name: rag-app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  ollama_data: